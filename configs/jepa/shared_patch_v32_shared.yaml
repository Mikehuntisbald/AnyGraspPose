architecture:
  appearance: trainable shared DINO blocks4/11 -> same spatial pair fusion
  geometry: observed 2-channel and rendered 5-channel stems -> shared CNN and residual
    blocks -> pair with explicit 2-channel residual -> residual CNN
  fusion: one 8-head appearance-query / geometry-key-value attention; positions on
    both sides; null option and residual; 256 patches by 256 channels
  jepa: four unique JEPA blocks; measured-only coarse CAD reads; late measured/recovered
    CAD read recomputes shared block4
  fp_scope: architecture idea only; no FP parameters, old project checkpoint or bypass
  history: disabled student read/write and replay loss; independent frames batched8
  readout: decoded DINO4/11 plus predicted canonical XYZ/camera depth, measured visible
    depth, full camera XYZ residual and signed covariance -> object query -> learned
    pose delta; no shared-latent skip
  geometry_readout: canonical soft CAD correspondence, measured target support, inferred
    confidence capped at 0.5 and reduced by measured support
