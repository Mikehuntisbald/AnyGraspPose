seed: 42
image_size: 224
clip_length: 1
world_size: 8
batch_size_per_gpu: 16
grad_accum_steps: 2
precision: bf16
pretrained: true
rgb_weights: torchvision.ResNet50_Weights.IMAGENET1K_V2
optimizer: adamw
lr_new_modules: 0.0001
lr_rgb_backbone: 1.0e-05
weight_decay: 0.05
max_optimizer_steps: 40000
warmup_optimizer_steps: 2000
backbone_ramp_steps: 1000
min_lr_ratio: 0.1
grad_clip_norm: 1.0
num_workers_per_rank: 4
cpu_threads: 2
prefetch_factor: 2
pin_memory: true
persistent_workers: true
save_every_optimizer_steps: 1000
quick_val_every_optimizer_steps: 2000
full_val_every_optimizer_steps: 5000
rollout_start_step: 30000
pose_token_dropout: 0.2
history_noise: true
augmentation: true
synthetic_erasure: false
crop_expansion: 2.0
depth_scale_to_m: 0.001
pose_scale_to_m: 1.0
mesh_scale_to_m: 1.0
fps: 30.0
canonical_gt: true
renderer: cuda
motion_speed_quantile: 0.75
